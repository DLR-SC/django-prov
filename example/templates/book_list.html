{% extends "base.html" %}

{% block content %}
    <h2>Books</h2>

    <table style="width: 50%">
        <tr>
            <th style="text-align:left">Book ISBN</th>
            <th style="text-align:left">Title</th>
            <th style="text-align:left">Author</th>
            <th style="text-align:left">Published</th>
            <th style="text-align:left">Borrowed ?</th>

        </tr>
        {% for book in object_list %}
            <tr>
                <td>{{ book.isbn }}</td>
                <td>{{ book.title }}</td>
                <td>{{ book.author}}</td>
                <td>{{ book.pub_year}}</td>
                <td>{{ book.is_borrowed}}</td>
            </tr>
        {% endfor %}
    </table>
    <p><a href="{% url 'order.list' %}">Order List</a></p>
    <p><a href="{% url 'borrowing.list' %}">Borrowing List</a></p>
    <p><a href="{% url 'index' %}">Back to Index</a> </p>
{% endblock %}
