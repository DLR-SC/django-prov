variables:
  ARTIFACTORY_AUTH: $ARTIFACTORY_USER:$ARTIFACTORY_TOKEN
  PYPI_MIRROR: https://$ARTIFACTORY_AUTH@artifacts.dlr.de/artifactory/api/pypi/$PYPI_REMOTE/simple

stages:
  - test
  - docs
  - package
  - publish

default:
  tags:
    - docker
  image: $DOCKERHUB_MIRROR/python:3.12
  before_script:
    - apt update -y
    - apt install -y graphviz graphviz-dev
    - pip install -e ".[test]"

.default_publish_rules:
  rules:
    # Publish only from tag pipelines with matching tag pattern
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/

test-django-execution:
  stage: test
  tags:
    - bacardi2
    - docker
  script:
    - cd example/
    - python -m django --version
    - python manage.py test tests

coverage-report:
  stage: test
  script:
    - mkdir -p build
    - pytest --cov --cov-report=term --cov-report=html --cov-report=xml --junitxml=build/test-report.xml tests/
  artifacts:
    expose_as: "Coverage Report"
    paths:
      - build/html-coverage/
    reports:
        junit: build/test-report.xml
        coverage_report:
          coverage_format: cobertura
          path: build/coverage.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

validate_release_tag:
  stage: test
  script:
    - python -c "import django_prov; assert django_prov.__version__ == '$CI_COMMIT_TAG'"
  rules:
    - !reference [.default_publish_rules, rules]

package:
  stage: package
  script:
    - pip wheel -w dist .
  artifacts:
    paths:
      - dist

publish-to-gitlab:
  stage: publish
  variables:
    PYPI_GITLAB: https://gitlab-ci-token:$CI_JOB_TOKEN@gitlab.dlr.de/api/v4/projects/11169/packages/pypi
  script:
    - twine upload --repository-url $PYPI_GITLAB --verbose dist/django_prov*.whl
  rules:
    - !reference [.default_publish_rules, rules]

publish-to-artifactory:
  stage: publish
  variables:
    PYPI_INTERNAL: https://$ARTIFACTORY_AUTH@artifacts.dlr.de/artifactory/api/pypi/$PYPI_LOCAL
  script:
    - twine upload --repository-url $PYPI_INTERNAL --verbose dist/django_prov*.whl
  rules:
    - !reference [.default_publish_rules, rules]
