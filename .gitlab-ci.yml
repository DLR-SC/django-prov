stages:
  - test
  - publish

default:
  image: python:3.12
  before_script:
    - apt update -y
    - apt install -y graphviz graphviz-dev
    - python -m venv env
    - source env/bin/activate
    - pip install .

test-django-execution:
  stage: test
  tags:
    - bacardi2
    - docker
  script:
    - cd example/
    - python -m django --version
    - python manage.py test tests

Publish process:
  stage: publish
  variables:
    TWINE_PASSWORD: ${CI_JOB_TOKEN}
    TWINE_USERNAME: gitlab-ci-token
  tags:
    - bacardi2
    - docker
  script:
    - cd ..
    - pwd
    - pip install twine
    - pip install -e .
    - pip wheel -e .
    - ls
    - twine upload --repository-url https://gitlab.dlr.de/api/v4/projects/11169/packages/pypi --verbose django_prov*.whl
